<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>语音输入设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #1e1e24; color: #e0e0e0; padding: 24px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 24px; color: #fff; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: 13px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .radio-group { display: flex; flex-direction: column; gap: 8px; }
    .radio-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .radio-item:hover { background: rgba(255,255,255,0.08); }
    .radio-item input[type="radio"] { accent-color: #ff4040; }
    .radio-item .label { flex: 1; }
    .radio-item .label .name { font-size: 14px; color: #e0e0e0; }
    .radio-item .label .desc { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #e0e0e0; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #ff4040; }
    .form-group .hint { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; }
    .save-btn { width: 100%; padding: 10px; background: #ff4040; border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .save-btn:hover { background: #e63939; }
    .status-msg { margin-top: 12px; font-size: 13px; text-align: center; padding: 8px; border-radius: 6px; display: none; }
    .status-msg.success { display: block; background: rgba(76,175,80,0.15); color: #81c784; }
    .status-msg.error { display: block; background: rgba(255,64,64,0.15); color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>语音输入设置</h1>
  <div class="section">
    <div class="section-title">语音识别引擎</div>
    <div class="radio-group" id="providerList"></div>
  </div>
  <div class="section" id="configSection">
    <div class="section-title">API 配置</div>
    <div id="providerConfig"></div>
  </div>
  <button class="save-btn" id="saveBtn">保存设置</button>
  <div class="status-msg" id="statusMsg"></div>
  <script src="settings.js"></script>
</body>
</html>
