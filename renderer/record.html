<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>语音输入</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    .container {
      width: 400px;
      height: 220px;
      background: rgba(30, 30, 35, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .drag-area { position:absolute; top:0; left:0; right:0; height:36px; -webkit-app-region:drag; }
    .mic-icon { width:64px; height:64px; border-radius:50%; background:rgba(255,64,64,0.15); display:flex; align-items:center; justify-content:center; transition:all 0.3s ease; }
    .mic-icon svg { width:32px; height:32px; fill:#ff4040; }
    .mic-icon.recording { background:rgba(255,64,64,0.3); animation:pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
    .status-text { color:rgba(255,255,255,0.85); font-size:14px; }
    .sub-text { color:rgba(255,255,255,0.4); font-size:12px; }
    .recognized-text { color:rgba(255,255,255,0.9); font-size:16px; text-align:center; padding:0 20px; max-height:40px; overflow:hidden; }
    .close-btn { position:absolute; top:6px; right:8px; z-index:10; width:24px; height:24px; border:none; background:rgba(255,255,255,0.08); border-radius:50%; color:rgba(255,255,255,0.5); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; }
    .close-btn:hover { background:rgba(255,64,64,0.3); color:#ff4040; }
    .native-hint { color:rgba(255,200,100,0.8); font-size:13px; text-align:center; padding:0 30px; display:none; }
    .native-hint.visible { display:block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="drag-area"></div>
    <button class="close-btn" id="closeBtn">&#x2715;</button>
    <div class="mic-icon" id="micIcon">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
    <div class="status-text" id="statusText">准备中...</div>
    <div class="sub-text" id="subText">按 Ctrl+Shift+V 呼出</div>
    <div class="recognized-text" id="recognizedText"></div>
    <div class="native-hint" id="nativeHint">请说话...(Windows 原生识别)</div>
  </div>
  <script src="record.js"></script>
</body>
</html>
